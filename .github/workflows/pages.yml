# Publica el sitio estático en GitHub Pages en cada push a master.
# Requiere una sola vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; no se cancela uno que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build estático
        run: npm run build
        env:
          # "/clean-home": la ruta donde Pages sirve el sitio.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # URL completa del sitio (con el dominio propio si está configurado), para sitemap y metadatos.
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
